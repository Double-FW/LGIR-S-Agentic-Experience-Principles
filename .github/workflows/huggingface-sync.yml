name: Update lgirs Hugging Face dataset

on:
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lgirs-huggingface-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Double-FW/LGIR-S-Agentic-Experience-Principles' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_DATASET_ID: ${{ vars.HF_DATASET_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check destination setting
        run: python -c "import os,sys; sys.path.insert(0,'scripts'); from lgirs_hf_common import destination; destination(os.environ.get('HF_DATASET_ID',''))"
      - name: Install publishing dependency
        run: python -m pip install -r huggingface/requirements.txt
      - name: Check repository and test export safeguards
        run: |
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
      - name: Build and validate the lgirs dataset
        run: python scripts/export_huggingface.py --output "${RUNNER_TEMP}/lgirs-dataset" --dataset-id "$HF_DATASET_ID"
      - name: Publish to the configured dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_huggingface.py --folder "${RUNNER_TEMP}/lgirs-dataset" --dataset-id "$HF_DATASET_ID"
